name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Repository rules (nothing private is tracked)
        run: python3 scripts/check_repo.py

      - name: Build the images
        run: docker compose build

      - name: dbt parse and model conventions
        run: |
          docker compose run --rm --no-deps -v "$PWD/scripts:/scripts:ro" --entrypoint sh dbt \
            -c "dbt parse && python /scripts/check_conventions.py target/manifest.json"

      - name: Full chain on sample data (raw, dbt build with tests, Elementary)
        run: docker compose run --rm elementary

      - name: Upload the Elementary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elementary-report
          path: report/elementary_report.html
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: docker compose down -v
