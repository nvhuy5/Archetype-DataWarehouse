version: 2

models:
  - name: stg_intranet__timesheet_component
    description: "Timesheet components."
    columns:
      - name: timesheet_component_id
        tests:
          - unique
          - not_null
    tests:
      # Elementary: fails when a column is added, removed or changes type
      - elementary.schema_changes
  - name: stg_intranet__timesheet_contract
    description: "Timesheet contracts."
    columns:
      - name: contract_id
        tests:
          - unique
          - not_null
    tests:
      # Elementary: fails when a column is added, removed or changes type
      - elementary.schema_changes
  - name: stg_intranet__timesheet_delta
    description: "Timesheet delta written back by ACT_SendTSDelta. Expected to be dropped, kept for parity with the old package."
    columns:
      - name: id
        tests:
          - unique
          - not_null
    tests:
      # Elementary: fails when a column is added, removed or changes type
      - elementary.schema_changes
  - name: stg_intranet__timesheet_entry
    description: "Timesheet entries, one row per employee, day and phase. The biggest table (about 1.5 million rows)."
    columns:
      - name: id
        tests:
          - unique
          - not_null
    tests:
      # Elementary: fails when a column is added, removed or changes type
      - elementary.schema_changes
  - name: stg_intranet__timesheet_phase
    description: "Timesheet phases (type of event)."
    columns:
      - name: phase_id
        tests:
          - unique
          - not_null
    tests:
      # Elementary: fails when a column is added, removed or changes type
      - elementary.schema_changes
  - name: stg_intranet__timesheet_project
    description: "Timesheet projects."
    columns:
      - name: timesheet_project_id
        tests:
          - unique
          - not_null
    tests:
      # Elementary: fails when a column is added, removed or changes type
      - elementary.schema_changes
