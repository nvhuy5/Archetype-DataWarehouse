name: archetype
version: "1.0.0"
config-version: 2
profile: archetype

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

# Layers: raw (loaded by ADF, not by dbt) -> staging -> dwh -> mart. Add a folder under models/ for each new layer.
models:
  elementary:
    +schema: elementary
  archetype:
    staging:
      +materialized: view
      +schema: staging
      intranet:
        hr:
          +tags: [hr]
        timesheet:
          +tags: [timesheet]
        crm:
          +tags: [crm]
        prm:
          +tags: [prm]
        strategic:
          +tags: [strategic]
    dwh:
      +materialized: table
      +schema: dwh
      intermediate:
        +materialized: view
    mart:
      +materialized: table
      +schema: mart
      # Power BI reads mart; the admin role also reads it. Models in mart_restricted override this (see NAMING.vi.md).
      +grants:
        select: [powerbi_ro, pii_admin]
    mart_restricted:
      +materialized: table
      +schema: mart_restricted
      +grants:
        select: [pii_admin]

seeds:
  archetype:
    +schema: dwh

vars:
  # First day of timesheet history kept in dwh.fact_timesheet. Same as the old SSIS package (2020-01-01); change when the customer sets the retention rule.
  timesheet_from_date: "2020-01-01"
