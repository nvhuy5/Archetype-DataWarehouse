# Local test of the whole chain:  source (few rows) -> ingest (what ADF does) -> raw -> dbt -> Elementary report
#   docker compose run --build --rm elementary        report: ./report/elementary_report.html
#   docker compose down -v                            clean up
name: archetype-demo

services:
  pg-source:                     # the Intranet (simulated)
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: intranet}
    volumes: ["./sample/source.sql:/docker-entrypoint-initdb.d/source.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d intranet"], interval: 3s, retries: 20}

  pg-analytics:                  # the warehouse; raw_init.sql = what the platform team creates once
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: analytics_db}
    volumes: ["./sample/raw_init.sql:/docker-entrypoint-initdb.d/raw_init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_db"], interval: 3s, retries: 20}

  ingest:                        # stands in for Azure Data Factory
    image: postgres:16
    environment:
      PGPASSWORD: postgres
      SRC_URL: postgresql://postgres:postgres@pg-source/intranet
      DST_URL: postgresql://postgres:postgres@pg-analytics/analytics_db
    volumes: ["./sample/ingest_demo.sh:/ingest.sh:ro"]
    command: ["sh", "/ingest.sh"]
    depends_on: {pg-source: {condition: service_healthy}, pg-analytics: {condition: service_healthy}}

  dbt:
    build: {context: ., dockerfile: dbt.Dockerfile}
    environment: &pg {PGHOST: pg-analytics, PGUSER: dbt_rw, PGPASSWORD: dbt_rw, PGDATABASE: analytics_db, PGSSLMODE: disable}
    depends_on: {ingest: {condition: service_completed_successfully}}

  elementary:
    build: {context: ., dockerfile: elementary.Dockerfile}
    environment: *pg
    volumes: ["./report:/report"]
    depends_on: {dbt: {condition: service_completed_successfully}}
