# Local test of the dbt chain on a local Postgres that already holds the raw data:
#   ./scripts/seed_local.sh          creates the raw tables with their sample rows (warehouse/local/seed); run it once and after editing a seed file
#   ./scripts/run_local.sh           dbt build (models + tests), then the Elementary report; report: ./report/elementary_report.html
#   ./scripts/seed_local.sh --reset  wipe the database first (same as docker compose down -v), then seed again
name: archetype-dbt

services:
  postgres-local:                # the local warehouse; warehouse/local/init = schemas and roles, created once (empty database)
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: analytics_db}
    volumes:
      - ./warehouse/local/init:/docker-entrypoint-initdb.d:ro
      - ./warehouse/local/seed:/seed:ro                # sample rows of the raw tables, applied by scripts/seed_local.sh
      - postgres_local_data:/var/lib/postgresql/data   # data survives `down`; `down -v` (or seed_local.sh --reset) wipes it
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_db"], interval: 3s, retries: 20}

  dbt:
    build: {context: ., dockerfile: dbt.Dockerfile}
    environment: &pg {PGHOST: postgres-local, PGUSER: dbt_rw, PGPASSWORD: dbt_rw, PGDATABASE: analytics_db, PGSSLMODE: disable}
    depends_on: {postgres-local: {condition: service_healthy}}

  report-dir:                    # makes ./report writable for the non-root user of the Elementary image
    image: busybox
    command: ["chmod", "777", "/report"]
    volumes: ["./report:/report"]

  elementary:
    build: {context: ., dockerfile: elementary.Dockerfile}
    environment: *pg
    volumes: ["./report:/report"]
    depends_on:
      dbt: {condition: service_completed_successfully}
      report-dir: {condition: service_completed_successfully}

volumes:
  postgres_local_data:
